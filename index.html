async function loadWorkspace(){

}

 if(me)throw me;

 document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('userLabel').textContent=session?.user?.email||'Utilizador';document.getElementById('hotelCrumb').textContent=w.name;render();
}

function ticketTable(rows){return `<div class="table-wrap"><table><thead><tr><th>Avaria</th><th>Área</th><th>Prioridade</th><th>Estado</th><th>Responsável</th><th>Data</th><th></th></tr></thead><tbody id="ticketTableBody">${rows.map(x=>`<tr data-status="${esc(x.status)}"><td><strong>${esc(x.title)}</strong><br><small style="color:#94a0a9">${esc(x.description||'')}</small></td><td>${esc(x.area)}</td><td>${badge(x.priority)}</td><td>${badge(x.status)}</td><td>${esc(x.assignee||'—')}</td><td>${fmt(x.date)}</td><td><button class="btn secondary" onclick="editTicket('${x.id}')">Abrir</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Sem avarias registadas.</td></tr>'}</tbody></table></div>`}
function filterTable(id,q){document.querySelectorAll('#'+id+' tr').forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(q.toLowerCase())?'':'none')}function filterStatus(id,s){document.querySelectorAll('#'+id+' tr').forEach(tr=>tr.style.display=(!s||tr.dataset.status===s)?'':'none')}
function modal(title,body){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h3>${title}</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body">${body}</div></div></div>`}function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function field(label,name,value='',type='text',extra=''){return `<div class="field"><label>${label}</label><input class="control" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}function selectField(label,name,opts,value){return `<div class="field"><label>${label}</label><select class="control" name="${name}">${opts.map(o=>`<option ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}
function openTicket(id){const x=id?hotel().tickets.find(a=>a.id===id):{};modal(id?'Editar avaria':'Registar nova avaria',`<form onsubmit="saveTicket(event,'${id||''}')"><div class="form-grid">${field('Descrição da avaria','title',x.title||'','text','required')}${field('Área / localização','area',x.area||'','text','required')}${selectField('Prioridade','priority',['Baixa','Normal','Urgente'],x.priority||'Normal')}${selectField('Estado','status',['Aberta','Em curso','Concluída'],x.status||'Aberta')}${field('Responsável','assignee',x.assignee||'')}${field('Data','date',x.date||today(),'date')}</div><div class="field"><label>Descrição / intervenção</label><textarea class="control" name="description">${esc(x.description||'')}</textarea></div><div class="modal-actions">${id?`<button type="button" class="btn danger" onclick="removeItem('tickets','${id}')">Eliminar</button>`:''}<button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn primary">Guardar avaria</button></div></form>`)}function editTicket(id){openTicket(id)}function saveTicket(e,id){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const h=hotel();if(id)Object.assign(h.tickets.find(x=>x.id===id),d);else h.tickets.unshift({id:uid(),...d});save();closeModal();render();toast('Avaria guardada com sucesso.')}
function openEquipment(id){const x=id?hotel().equipment.find(a=>a.id===id):{};modal(id?'Editar equipamento':'Novo equipamento',`<form onsubmit="saveEquipment(event,'${id||''}')"><div class="form-grid">${field('Nome do equipamento','name',x.name||'','text','required')}${field('Código interno','code',x.code||'')}${field('Categoria','category',x.category||'')}${field('Localização','location',x.location||'')}${selectField('Estado','status',['Operacional','A verificar','Fora de serviço'],x.status||'Operacional')}${field('Última intervenção','last',x.last||today(),'date')}</div><div class="modal-actions">${id?`<button type="button" class="btn danger" onclick="removeItem('equipment','${id}')">Eliminar</button>`:''}<button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn primary">Guardar equipamento</button></div></form>`)}function editEquipment(id){openEquipment(id)}function saveEquipment(e,id){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const h=hotel();if(id)Object.assign(h.equipment.find(x=>x.id===id),d);else h.equipment.push({id:uid(),...d});save();closeModal();render();toast('Equipamento guardado.')}
function openPreventive(){modal('Nova tarefa preventiva',`<form onsubmit="savePreventive(event)"><div class="form-grid">${field('Nome da tarefa','title','','text','required')}${field('Equipamento','equipment','','text','required')}${selectField('Periodicidade','frequency',['Diária','Semanal','Quinzenal','Mensal','Trimestral','Semestral','Anual'],'Mensal')}${field('Próxima data','due',today(),'date')}${field('Responsável','assignee')}</div><div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn primary">Criar tarefa</button></div></form>`)}function savePreventive(e){e.preventDefault();hotel().preventive.push({id:uid(),...Object.fromEntries(new FormData(e.target)),status:'Pendente'});save();closeModal();render();toast('Tarefa preventiva criada.')}function togglePreventive(id){const x=hotel().preventive.find(a=>a.id===id);x.status=x.status==='Concluída'?'Pendente':'Concluída';save();render();toast('Estado atualizado.')}
function openPool(id){const x=id?hotel().pools.find(a=>a.id===id):{};modal(id?'Editar medição':'Registar medição de piscina',`<form onsubmit="savePool(event,'${id||''}')"><div class="form-grid">${field('Nome da piscina','name',x.name||'','text','required')}${field('Localização','location',x.location||'')}${field('pH','ph',x.ph??7.2,'number','step="0.01" required')}${field('Cloro livre (mg/L)','chlorine',x.chlorine??1.0,'number','step="0.01" required')}${field('Temperatura (°C)','temp',x.temp??25,'number','step="0.1"')}${field('Data da medição','date',x.date||today(),'date')}</div><div class="modal-actions">${id?`<button type="button" class="btn danger" onclick="removeItem('pools','${id}')">Eliminar</button>`:''}<button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn primary">Guardar medição</button></div></form>`)}function editPool(id){openPool(id)}function savePool(e,id){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const h=hotel();if(id)Object.assign(h.pools.find(x=>x.id===id),d);else h.pools.unshift({id:uid(),...d});save();closeModal();render();toast('Medição guardada.')}
function openTeam(id){const x=id?hotel().team.find(a=>a.id===id):{};modal(id?'Editar elemento':'Adicionar elemento à equipa',`<form onsubmit="saveTeam(event,'${id||''}')"><div class="form-grid">${field('Nome','name',x.name||'','text','required')}${field('Função','role',x.role||'')}${field('Email','email',x.email||'','email')}</div><div class="modal-actions">${id?`<button type="button" class="btn danger" onclick="removeItem('team','${id}')">Eliminar</button>`:''}<button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn primary">Guardar elemento</button></div></form>`)}function editTeam(id){openTeam(id)}function saveTeam(e,id){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const h=hotel();if(id)Object.assign(h.team.find(x=>x.id===id),d);else h.team.push({id:uid(),...d});save();closeModal();render();toast('Equipa atualizada.')}
function removeItem(type,id){if(!confirm('Tem a certeza de que pretende eliminar este registo?'))return;hotel()[type]=hotel()[type].filter(x=>x.id!==id);save();closeModal();render();toast('Registo eliminado.')}
function createHotel(){toast('A criação de unidades adicionais será disponibilizada na gestão de organizações.');return;modal('Criar novo espaço de hotel',`<form onsubmit="createHotelSubmit(event)">${field('Nome do hotel / unidade','name','','text','required')}<div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn primary">Criar espaço</button></div></form>`)}function createHotelSubmit(e){e.preventDefault();const name=new FormData(e.target).get('name').trim();const h=seed(name);db.hotels.push(h);save();current=h.id;renderTenantOptions();closeModal();enter(current);toast('Novo espaço criado.')}
async function renameHotel(e){e.preventDefault();const name=document.getElementById('hotelName').value.trim();const {error}=await sb.from('hotelcare_workspaces').update({name}).eq('id',workspaceId);if(error){toast('Erro ao atualizar: '+error.message);return}hotel().name=name;save();document.getElementById('hotelCrumb').textContent=name;render();toast('Nome atualizado.');}
function deleteHotel(){if(db.hotels.length===1){toast('É necessário manter pelo menos um hotel.');return}if(!confirm('Eliminar este espaço e todos os seus registos locais?'))return;db.hotels=db.hotels.filter(h=>h.id!==current);save();current=db.hotels[0].id;renderTenantOptions();enter(current);toast('Espaço eliminado.')}
function exportCSV(type){const h=hotel(),rows=h[type]||[];if(!rows.length){toast('Não existem registos para exportar.');return}const keys=Object.keys(rows[0]);const csv=[keys.join(';'),...rows.map(r=>keys.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(';'))].join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`hotelcare-${type}-${today()}.csv`;a.click();URL.revokeObjectURL(a.href);toast('Ficheiro CSV exportado.')}

async function generateMonthlyReport(){
 const h=hotel();
 if(!h||!workspaceId||!session?.user?.id){
  toast('Não foi possível identificar o hotel ou a conta.');
  return;
 }
 const now=new Date();
 const start=new Date(now.getFullYear(),now.getMonth(),1);
 const end=new Date(now.getFullYear(),now.getMonth()+1,0);
 const periodStart=start.toISOString().slice(0,10);
 const periodEnd=end.toISOString().slice(0,10);
 const monthLabel=start.toLocaleDateString('pt-PT',{month:'long',year:'numeric'});
 const reportData={
  hotel:h.name,
  generated_at:now.toISOString(),
  period_start:periodStart,
  period_end:periodEnd,
  tickets:h.tickets||[],
  equipment:h.equipment||[],
  preventive:h.preventive||[],
  pools:h.pools||[],
  team:h.team||[]
 };
 const {error}=await sb.from('hotelcare_generated_reports').insert({
  workspace_id:workspaceId,
  title:'Relatório mensal — '+h.name+' — '+monthLabel,
  report_type:'monthly',
  period_start:periodStart,
  period_end:periodEnd,
  generation_mode:'manual',
  report_data:reportData,
  generated_by:session.user.id
 });
 if(error){
  console.error(error);
  toast('Erro ao guardar relatório: '+error.message);
  return;
 }
 toast('Relatório guardado com sucesso!');
 await loadGeneratedReports();
}
 async function loadGeneratedReports(){
 const box=document.getElementById('generatedReports');
 if(!box||!workspaceId)return;

 box.innerHTML='<div class="empty">A carregar relatórios...</div>';

 const {data,error}=await sb.from('hotelcare_generated_reports')
 .select('id,title,report_type,period_start,period_end,generation_mode,created_at')
 .eq('workspace_id',workspaceId)
 .order('created_at',{ascending:false})
 .limit(12);

 if(error){
  console.error(error);
  box.innerHTML='<div class="empty">Erro ao carregar histórico.</div>';
  return;
 }

 if(!data||!data.length){
  box.innerHTML='<div class="empty">Ainda não existem relatórios.</div>';
  return;
 }

 box.innerHTML='<div class="table-wrap"><table><thead><tr><th>Relatório</th><th>Período</th><th>Modo</th><th>Data</th></tr></thead><tbody>'+
 data.map(r=>'<tr><td>'+esc(r.title)+'</td><td>'+fmt(r.period_start)+' a '+fmt(r.period_end)+'</td><td>'+(r.generation_mode==='automatic'?'Automático':'Manual')+'</td><td>'+new Date(r.created_at).toLocaleDateString('pt-PT')+'</td></tr>').join('')+
 '</tbody></table></div>';
}
 load();
</script>
</body></html>
